<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mrama Institute for Quantum Information and Intelligence</title>
    <meta
      name="description"
      content="Mrama Institute for Quantum Information and Intelligence is an independent research institute advancing quantum computing, quantum information science, artificial intelligence, and intelligent optimization."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mrama Institute for Quantum Information and Intelligence" />
    <meta
      property="og:description"
      content="An independent research institute advancing quantum computing, quantum information science, artificial intelligence, and intelligent optimization."
    />
    <meta property="og:url" content="https://mrama.org" />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mrama Institute for Quantum Information and Intelligence" />
    <meta
      name="twitter:description"
      content="An independent research institute advancing quantum computing, quantum information science, artificial intelligence, and intelligent optimization."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Hero portrait layer: preloaded so it's painted before/with first contentful
         text, avoiding a flash-in. Requires public/brand/portrait.webp to exist. -->
    <link
      rel="preload"
      as="image"
      href="/brand/portrait.webp"
      imagesrcset="/brand/portrait.webp 1x, /brand/portrait@2x.webp 2x"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
